services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clear_grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clear_grid_password}
      POSTGRES_DB: ${POSTGRES_DB:-clear_grid}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  admin:
    image: dpage/pgadmin4
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_default_password}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8080}:80"
    volumes:
      - admin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: containers/cg-app-dockerfile
    environment:
      FLASK_APP: clear_grid_flask_shell_ctx:app
      SECRET_KEY: ${SECRET_KEY:-you-will-never-guess}
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-clear_grid}:${POSTGRES_PASSWORD:-clear_grid_password}@db:5432/${POSTGRES_DB:-clear_grid}"
      NESO_API_BASE_URL: "${NESO_API_BASE_URL:-https://api.neso.energy/api/3/action}"
      NESO_RESOURCE_ID: "${NESO_RESOURCE_ID:-a63ab354-7e68-44c2-ad96-c6f920c30e85}"
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
  ui:
    build:
      context: .
      dockerfile: containers/cg-ui-dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000}
    ports:
      - "127.0.0.1:${UI_PORT:-5173}:5173"
    depends_on:
      app:
        condition: service_started
volumes:
  db-data:
  admin_data: